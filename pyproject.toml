[project]
name = "filler-token-reasoning"
version = "0.1.0"
description = "Code and results for 'LLMs can learn (some) multi-step reasoning on filler tokens'"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "research-scaffold",
    "tinker>=0.12.0",
    "tinker-cookbook==0.3.0",
    "wandb>=0.18.0",
    "pyyaml>=6.0.3",
    "numpy",
    "scipy>=1.17.1",
    "matplotlib>=3.10.8",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib"]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]

[tool.uv]
override-dependencies = [
    "torch==2.9.1+cpu ; sys_platform == 'linux'",
    "torch>=2.9.0 ; sys_platform == 'darwin'",
    "transformers>=4.40.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
research-scaffold = { git = "https://github.com/jr-brown/research-scaffold.git" }
tinker-cookbook = { git = "https://github.com/thinking-machines-lab/tinker-cookbook.git" }
