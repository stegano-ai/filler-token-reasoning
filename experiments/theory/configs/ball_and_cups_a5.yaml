common_root: configs/base.yaml

# block_scan is the per-preset construction (block-aligned radix-5 scan; linear layers carry the
# scan steps under qwen, full layers under oss). prefix_radix is the ideal-model construction and
# is listed under bf16 only: its worker region is 2n positions away, which a qwen linear head
# cannot key on (> lin_keys) and an oss window layer cannot see.
experiments:
  - config:
      name: a5_serial_bf16
      function_kwargs:
        problem: ball_and_cups_a5
        circuit: serial
        arch: bf16
  - config:
      name: a5_serial_qwen
      function_kwargs:
        problem: ball_and_cups_a5
        circuit: serial
        arch: qwen
  - config:
      name: a5_serial_oss
      function_kwargs:
        problem: ball_and_cups_a5
        circuit: serial
        arch: oss
  - config:
      name: a5_prefix_bf16
      function_kwargs:
        problem: ball_and_cups_a5
        circuit: prefix_radix
        arch: bf16
  - config:
      name: a5_block_bf16
      function_kwargs:
        problem: ball_and_cups_a5
        circuit: block_scan
        arch: bf16
        final_seconds: 45.0
  - config:
      name: a5_block_qwen
      function_kwargs:
        problem: ball_and_cups_a5
        circuit: block_scan
        arch: qwen
        final_seconds: 45.0
  - config:
      name: a5_block_oss
      function_kwargs:
        problem: ball_and_cups_a5
        circuit: block_scan
        arch: oss
        final_seconds: 45.0
