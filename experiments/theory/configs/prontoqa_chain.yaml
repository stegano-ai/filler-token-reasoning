common_root: configs/base.yaml

# max_n 512: the generator's name pool is exhausted at 1024 hops, and 768 dies silently.
experiments:
  - config:
      name: chain_serial_qwen
      function_kwargs:
        max_n: 512
        problem: prontoqa_chain
        circuit: serial
        arch: qwen
  - config:
      name: chain_serial_oss
      function_kwargs:
        max_n: 512
        problem: prontoqa_chain
        circuit: serial
        arch: oss
  - config:
      name: chain_interval_merge3_qwen
      function_kwargs:
        max_n: 512
        problem: prontoqa_chain
        circuit: interval_merge3
        arch: qwen
  - config:
      name: chain_interval_merge3_oss
      function_kwargs:
        max_n: 512
        problem: prontoqa_chain
        circuit: interval_merge3
        arch: oss
  - config:
      name: chain_contain_hit_qwen
      function_kwargs:
        max_n: 512
        problem: prontoqa_chain
        circuit: contain_hit
        arch: qwen
        final_seconds: 30.0
  - config:
      name: chain_contain_hit_oss
      function_kwargs:
        max_n: 512
        problem: prontoqa_chain
        circuit: contain_hit
        arch: oss
        final_seconds: 30.0
  - config:
      name: chain_walk_back_qwen
      function_kwargs:
        max_n: 512
        problem: prontoqa_chain
        circuit: walk_back
        arch: qwen
        final_seconds: 30.0
  - config:
      name: chain_walk_back_oss
      function_kwargs:
        max_n: 512
        problem: prontoqa_chain
        circuit: walk_back
        arch: oss
        final_seconds: 30.0
