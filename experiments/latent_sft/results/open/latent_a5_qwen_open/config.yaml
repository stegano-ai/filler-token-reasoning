function_args: []
function_kwargs:
  batch_size: 16
  early_stop_metric: eval_open/output_correct
  early_stop_min_steps: 50
  early_stop_threshold: 0.9
  log_path: results/open/latent_a5_qwen_open
  model_name: Qwen/Qwen3.6-35B-A3B
  n_eval: 20
  n_final_eval: 200
  n_train: 2000
  open_fraction: 1.0
  renderer_name: qwen3_5_disable_thinking
  seed: 0
  sft:
    eval_every: 100
    learning_rate: 0.00016
    load_checkpoint_path: null
    lora_rank: 32
    lr_schedule: constant
    num_epochs: 17
    save_every: 100
  side_task:
    n_samples: 4000
    reasoning_in_output: false
    seq_length: 100
    type: ball_and_cups
  stages:
  - {}
  task_prompt: 'Five cups sit at positions 0-4; a ball starts under the cup at position
    0. You will get a list of moves, each 0 or 1. Apply them in order. 0 = Rotate:
    every cup moves from position p to (p+1) mod 5. 1 = Double-Swap: the cups at positions
    0 and 1 swap, and the cups at positions 3 and 4 swap.


    For example, for moves [1, 0]: the Double-Swap moves the ball from position 0
    to position 1, then the Rotate moves it from position 1 to position 2, so the
    answer is 2.


    Moves: {SIDE_INPUT}


    Where is the ball at the end? Answer with a single digit from 0 to {MAX_VALUE}
    after ####.

    '
  wandb_name: latent_a5_qwen_open
  wandb_project: steg-transfer-learning
