function_args: []
function_kwargs:
  batch_size: 16
  early_stop_metric: eval/output_correct
  early_stop_min_steps: 50
  early_stop_threshold: 0.9
  log_path: results/nocot/latent_fc_oss20b_nocot
  model_name: openai/gpt-oss-20b
  n_eval: 20
  n_final_eval: 200
  n_train: 2000
  renderer_name: gpt_oss_no_sysprompt
  seed: 0
  sft:
    eval_every: 100
    learning_rate: 0.00012
    load_checkpoint_path: null
    lora_rank: 32
    lr_schedule: constant
    num_epochs: 17
    save_every: 100
  side_task:
    domain_size: 8
    n_hops: 25
    n_samples: 4000
    reasoning_in_output: false
    type: function_composition
  stages:
  - n_eval: 10
    n_final_eval: 60
    side_task:
      n_hops: 1
      n_samples: 400
  - n_eval: 20
    n_final_eval: 100
    side_task:
      n_hops: 2
      n_samples: 800
  - side_task:
      n_hops: 4
  - side_task:
      n_hops: 8
  - side_task:
      n_hops: 16
  - side_task:
      n_hops: 25
  task_prompt: '{SIDE_TASK_EXPLANATION}


    {SIDE_INPUT}


    Answer with a single digit after ####: the final value after applying all the
    tables.

    '
  use_filler: false
  wandb_name: latent_fc_oss20b_nocot
  wandb_project: steg-transfer-learning
function_name: train_curriculum
log_file_path: results/nocot/latent_fc_oss20b_nocot/logs.txt
