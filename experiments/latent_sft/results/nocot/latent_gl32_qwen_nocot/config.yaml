function_args: []
function_kwargs:
  batch_size: 16
  early_stop_metric: eval/output_correct
  early_stop_min_steps: 50
  early_stop_threshold: 0.9
  log_path: results/nocot/latent_gl32_qwen_nocot
  model_name: Qwen/Qwen3.6-35B-A3B
  n_eval: 20
  n_final_eval: 200
  n_train: 2000
  renderer_name: qwen3_5_disable_thinking
  seed: 0
  sft:
    eval_every: 100
    learning_rate: 0.00016
    load_checkpoint_path: null
    lora_rank: 32
    lr_schedule: constant
    num_epochs: 17
    save_every: 100
  side_task:
    n_samples: 4000
    reasoning_in_output: false
    seq_length: 100
    type: gl32
  stages:
  - n_eval: 20
    n_final_eval: 100
    side_task:
      n_samples: 800
      seq_length: 10
  - side_task:
      seq_length: 20
  - side_task:
      seq_length: 30
  - side_task:
      seq_length: 40
  - side_task:
      seq_length: 60
  - side_task:
      seq_length: 100
  task_prompt: 'Three lamps sit in a ring: lamp A, lamp B, lamp C. Only lamp A is
    on at the start. You will get a list of moves, each 0 or 1. Apply them in order.
    0 = Shift: every lamp passes its on/off state to the next lamp (A''s state moves
    to B, B''s to C, C''s to A). 1 = Couple: if lamp A is on, lamp B toggles; if lamp
    A is off, nothing happens.


    Encode a lamp pattern as the number A + 2*B + 4*C, counting an on lamp as 1. For
    example, for moves [1, 0]: the Couple turns lamp B on (lamp A is on), then the
    Shift passes each state along the ring, leaving lamps B and C on, so the answer
    is 6.


    Moves: {SIDE_INPUT}


    What is the final pattern number? Answer with a single digit from 1 to 7 after
    ####.

    '
  use_filler: false
  wandb_name: latent_gl32_qwen_nocot
  wandb_project: steg-transfer-learning
